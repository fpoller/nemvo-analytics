name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find nemvo-analytics -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  build:
    name: Build zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: for f in nemvo-analytics/assets/js/*.js; do node --check "$f"; done
      - name: Minified tracker is up to date
        run: |
          tools/minify-tracker.sh
          git diff --exit-code nemvo-analytics/assets/js/tracker.min.js
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nemvo-analytics-zip
          path: dist/*.zip

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./nemvo-analytics
          slug: nemvo-analytics
